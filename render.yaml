services:
  - type: web
    name: bizgrow-ai-server
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install && npm run init-db
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: DB_PATH
        value: ./database/bizgrow.db

  - type: web
    name: bizgrow-ai-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bizgrow-ai-server.onrender.com/api/*
    envVars:
      - key: VITE_API_URL
        value: https://bizgrow-ai-server.onrender.com